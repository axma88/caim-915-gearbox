<style>
  /* Раскладка этапа 5, доработка 1 (решение 63): верх — блок в левом верхнем углу, два ряда по три
     («Качество ▾ · Разобрать⇄Собрать · Подсветка» / «Картер · Крышка · Муфты»); низ — один ряд «◀ ■ ▶ ⟲ ⌂ Облёт» по центру.
     Подложки нет: кнопки полупрозрачные (заливка 70 %), текст и значки непрозрачные, без тени (тень дорогая в WebKit); размытия фона нет.
     Телефон вертикально — оба блока во всю ширину; телефон горизонтально (высота < 500 px) — верх в один ряд из шести. */
  :root { --bg: #1b1d20; --txt: #fff; --line: rgba(255,255,255,.28); --btn: rgba(30,34,39,.70); --btn-hi: rgba(52,58,65,.70); --acc: rgba(47,158,110,.70); --acc-line: rgba(90,215,160,.85); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  button, .sel { min-height: 46px; min-width: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--btn); color: var(--txt); font: 600 16px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; white-space: nowrap; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* тень у текста кнопок убрана: в WebKit (эмуляция iPhone) она стоила ≈13 мс на кадр — слои поверх WebGL перерисовываются каждый кадр;
     белый текст и так читается на тёмной заливке 70 % */
  /* наведение — только где есть мышь: на телефоне :hover «залипает» после касания */
  @media (hover: hover) and (pointer: fine) { button:hover, .sel:hover { background: var(--btn-hi); } }
  button { transition: background-color .15s, border-color .15s; }
  /* кнопки действий (решение 67): зелёная вспышка ≈0,25 с при нажатии/касании (класс flash ставит и снимает app.js) */
  button.flash { background: var(--acc); border-color: var(--acc-line); transition: none; }
  button:focus-visible, .sel:focus-visible { outline: 2px solid var(--acc-line); outline-offset: 2px; }
  button.on { background: var(--acc); border-color: var(--acc-line); }
  button:disabled, .sel:disabled { opacity: .45; cursor: default; }
  .ico { font-size: 20px; padding: 0 10px; }
  /* «Качество» — системный список, оформленный как кнопка: на телефоне открывает системный выбор. В Safari appearance: none,
     иначе текст пропадает на белом системном поле; варианты списка — тёмные с белым текстом (где браузер их раскрашивает) */
  .sel { -webkit-appearance: none; appearance: none; padding-right: 30px; text-align: left; text-align-last: left;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
    background-position: calc(100% - 17px) 52%, calc(100% - 11px) 52%; background-size: 6px 6px; background-repeat: no-repeat; }
  .sel option { color: #fff; background: #23272c; }

  #top { position: fixed; z-index: 5; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: min(480px, calc(100vw - 16px)); }
  #top > * { width: 100%; min-width: 0; }
  #bottom { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom));
    display: flex; gap: 6px; }
  #bottom > .ico { width: 46px; flex: 0 0 auto; }
  #fs svg { width: 20px; height: 20px; display: block; margin: auto; }
  [hidden] { display: none !important; }
  body.noq #quality { display: none; }
  body.noq #top { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  body.noq #explode, body.noq #lights { grid-column: span 3; }
  body.noq #housing2, body.noq #housing1, body.noq #couplings { grid-column: span 2; }
  #legal { position: fixed; z-index: 4; right: max(10px, env(safe-area-inset-right)); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 54px);
    font-size: 11px; color: rgba(255,255,255,.9); background: rgba(0,0,0,.38); padding: 2px 6px; border-radius: 4px; pointer-events: none; }

  /* телефон вертикально: оба блока во всю ширину, низ — семь кнопок в ряд (значки ≥ 44 px, «Облёт» шире); строка © — над нижним рядом */
  @media (max-width: 639px) {
    #top { right: max(8px, env(safe-area-inset-right)); width: auto; }
    #bottom { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); transform: none; }
    #bottom > button { flex: 1 1 44px; min-width: 44px; width: auto; padding: 0 6px; }
    #bottom > #orbit { flex: 1.4 1 54px; }
    button, .sel { font-size: 15px; padding: 0 8px; }
    .sel { padding-right: 26px; }
  }
  /* узкий телефон (360 px): ряд из семи без переноса и без обрезки — значки 44 px, промежуток 3 px, «Облёт» 14 px с малым отступом */
  @media (max-width: 380px) { #bottom { gap: 3px; } #bottom > button { padding: 0 3px; } #bottom > #orbit { font-size: 14px; padding: 0 2px; } }
  /* телефон горизонтально (высота < 500 px) — буква «Г» (решение 65; класс land ставит app.js): слева столбец, внизу ряд правее столбца;
     не влезшие по высоте кнопки app.js переносит по порядку в начало нижнего ряда (класс over: столбец кончается над нижним рядом) */
  body.land #top { display: flex; flex-direction: column; width: 150px; right: auto; bottom: max(8px, env(safe-area-inset-bottom)); gap: 6px; }
  body.land #top > * { flex: 0 0 44px; min-height: 44px; width: 100%; font-size: 15px; padding: 0 8px; }
  body.land .sel { padding-right: 26px; }
  body.land #bottom { left: calc(max(8px, env(safe-area-inset-left)) + 156px); right: auto; transform: none; }
  body.land #bottom > button { min-height: 44px; font-size: 15px; }
  body.land #bottom > .ico { width: 44px; }
  body.land #bottom > .moved { padding: 0 12px; }
  body.land #bottom > select.moved { padding-right: 28px; }
  body.land.over #top { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 50px); }
  body.land.over #bottom { left: max(8px, env(safe-area-inset-left)); }
  body.land #legal { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 50px); }

  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(27,29,32,.78); z-index: 6; font-size: 22px; text-align: center; padding: 16px; }
  #load .pct { font-size: 46px; font-weight: 700; }
  #res { position: fixed; left: 8px; right: 8px; top: 50%; transform: translateY(-50%); max-height: 80vh; overflow: auto; z-index: 8; display: none;
    background: rgba(10,12,14,.96); border: 1px solid #4a5058; border-radius: 12px; padding: 14px 16px; }
  #res pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 15px/1.45 ui-monospace, Consolas, monospace; }
  #res button { margin-top: 12px; width: 100%; }
  /* меню разработчика (скрыто): ?dev=1 или долгое нажатие 2 с на ⌂; справа над нижним рядом */
  #dev { position: fixed; z-index: 7; right: max(8px, env(safe-area-inset-right)); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 76px); display: none; margin-bottom: 4px;
    background: rgba(10,12,14,.92); border: 1px solid #4a5058; border-radius: 10px; padding: 8px; gap: 8px; align-items: center; max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: flex-end; }
  body.dev #dev { display: flex; }
  #state { font: 13px/1.3 ui-monospace, Consolas, monospace; color: #c9d0d7; }
  #dev button { min-height: 40px; font-size: 14px; }
</style>
